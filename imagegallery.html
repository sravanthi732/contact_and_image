<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customised Dress Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #eff2f2;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      padding: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .details {
      padding: 10px;
    }

    .details h3 {
      margin: 10px 0 5px;
    }

    .details p {
      margin: 4px 0;
      color: #555;
    }
    h3{
      color:#0056b3;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Customised Dress Gallery</h1>
  <h3>Add New Dress</h3>

  <input type="text" id="meter" placeholder="Meter" required>
  <input type="url" id="image" placeholder="Image URL" required>
  <button type="submit">Add Dress</button>
</form>
